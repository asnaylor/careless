name: Build container

on:
  workflow_dispatch:
  push:
    branches:
      - pytorch-migration
    paths:
      - Containerfile
      - pyproject.toml
      - careless/**
      - tests/**
      - .github/workflows/container.yml
  pull_request:
    branches:
      - pytorch-migration
    paths:
      - Containerfile
      - pyproject.toml
      - careless/**
      - tests/**
      - .github/workflows/container.yml

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NGC container
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          tags: careless:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min
